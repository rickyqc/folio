# yaml-language-server: $schema=./folio.schema.json
#
# This is your whole page. Change the details below, then commit.
# Rather fill in a form? The config builder writes this file for you:
#   https://folio-rouge-kappa-88.vercel.app/#build
# Lines starting with # are notes and are ignored.
# Every option is explained in docs/CONFIG.md.

site:
  # Your page's address. Vercel, Netlify and GitHub Pages fill this in for you;
  # set it when you add your own domain (e.g. https://jane.dev).
  # url: https://jane.dev
  title: Jane Park
  description: Product designer and writer in San Francisco.

profile:
  name: Jane Park
  bio: Product designer. Writing about craft and tools.
  # Put your photo in the public folder and write its file name here,
  # or use an emoji instead, e.g.  avatar: "👩‍🎨"
  avatar: avatar.svg
  location: San Francisco, CA

theme:
  mode: auto # auto (follows the visitor's device) | light | dark
  accent: '#0071e3' # any hex color, in quotes
  buttons: rounded # rounded | pill

# Your username on each platform, or a full link. Delete the ones you don't use.
# The samples below just point to each site's home page. Replace them with yours,
# e.g.  instagram: your-username
socials:
  instagram: https://instagram.com
  youtube: https://youtube.com
  github: https://github.com/rickyqc/folio
  email: hi@example.com

# Your page, top to bottom. Each item starts with "- type:".
blocks:
  - type: link
    title: Read my newsletter
    subtitle: Notes on craft, every other Sunday
    url: https://example.com/newsletter
    icon: "💌" # a platform name like youtube, or any emoji
    featured: true # your one highlighted link

  - type: header
    title: Work

  - type: link
    title: Portfolio
    subtitle: Apps, brands and type, 2022–2026
    url: https://example.com/work
    icon: "🎨"

  - type: link
    title: Book a design review
    subtitle: 30 minutes, free for students
    url: https://example.com/book
    icon: "☕️"

  - type: link
    title: Shop my icon set
    subtitle: 400 hand-drawn icons for Figma
    url: https://example.com/shop
    icon: "✨"

  - type: header
    title: Watch and listen

  - type: youtube
    url: https://www.youtube.com/watch?v=aqz-KE-bpKQ
    title: Big Buck Bunny

  - type: spotify
    url: https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M

  # An image card. Put the file in the public folder. "alt" describes it for screen readers.
  # - type: image
  #   src: poster.jpg
  #   alt: Poster for my spring show
  #   url: https://example.com/tickets

contact:
  vcard: true # show a "Save contact" button
  # phone: "+1 555 0100"
  # organization: Park Studio

analytics:
  provider: none # none | plausible | umami

footer:
  share: false # true adds a Share button (uses a tiny script)
  credit: true # small "Made with Folio" link
