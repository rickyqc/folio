name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ASTRO_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Page budget (0 KB JS, under 50 KB)
        run: npm run budget
