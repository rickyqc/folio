# Publishes your page to GitHub Pages on every push to main.
# To use it in your copy: Settings → Pages → Source: GitHub Actions,
# then Settings → Secrets and variables → Actions → Variables → add FOLIO_PAGES = true.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: 1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Folio's own repo publishes its demo; copies opt in with the FOLIO_PAGES variable.
    if: github.repository == 'rickyqc/folio' || vars.FOLIO_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
